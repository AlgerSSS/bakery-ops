[project]
name = "hotcrush-data-platform"
version = "0.1.0"
description = "Controlled Supabase ingestion and PDF/RAG worker for Hot Crush"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28,<1",
  "openai>=1.100,<2",
  "pymupdf>=1.26,<2",
  "python-dotenv>=1.1,<2",
]

[project.scripts]
brainctl = "hotcrush_data_platform.brainctl:main"
hotcrush-rag-worker = "hotcrush_data_platform.worker:main"

[dependency-groups]
dev = ["pytest>=8.4,<9", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
